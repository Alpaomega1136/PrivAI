# nginx config for the PrivAI frontend container.
# Serves the static SPA and reverse-proxies /api/* to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All backend calls. "backend" is the docker-compose service name.
    # The frontend talks to /api on its own origin, so no CORS is involved.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # The live MJPEG stream (/api/live/turbo/mjpeg) needs an unbuffered,
        # long-lived connection — disable buffering and raise the timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Optional: expose the backend's interactive API docs through the frontend.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
