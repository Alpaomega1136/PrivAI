# nginx config for the PrivAI frontend container.
# Serves the static SPA and reverse-proxies /api/* to the backend service.
server {
    listen 80;
    server_name _;

    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All backend calls. In Azure Container Apps this proxies to the deployed
    # FastAPI backend, keeping same-origin /api fallback available.
    location /api/ {
        proxy_pass https://privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # The live MJPEG stream (/api/live/turbo/mjpeg) needs an unbuffered,
        # long-lived connection. Disable buffering and raise the timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Optional: expose the backend's interactive API docs through the frontend.
    location /docs {
        proxy_pass https://privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io/docs;
        proxy_ssl_server_name on;
        proxy_set_header Host privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io;
    }
    location /openapi.json {
        proxy_pass https://privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io/openapi.json;
        proxy_ssl_server_name on;
        proxy_set_header Host privai-backend.orangebeach-03038aed.southeastasia.azurecontainerapps.io;
    }
}
