services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privai-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      MODEL_PATH: ${MODEL_PATH:-/app/models/model_deteksi.pt}
      CONFIG_PATH: ${CONFIG_PATH:-/app/config/runtime.yaml}
      DATA_DIR: ${DATA_DIR:-/app/data}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./backend/models:/app/models:ro
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: privai-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
